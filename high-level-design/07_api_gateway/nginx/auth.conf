map $http_x_api_key $key_valid {
    default          0;
    "demo-key-123"   1;
    "demo-key-456"   1;
}

upstream users {
    server user-service:8080;
}

upstream products {
    server product-service:8080;
}

server {
    listen 80;

    location /api/users {
        if ($key_valid = 0) {
            return 401 '{"error":"missing or invalid X-Api-Key"}\n';
        }
        proxy_pass       http://users/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/products {
        if ($key_valid = 0) {
            return 401 '{"error":"missing or invalid X-Api-Key"}\n';
        }
        proxy_pass       http://products/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"unknown route"}\n';
    }
}
