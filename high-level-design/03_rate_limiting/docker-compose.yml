services:
  server:
    build: ./server
    environment:
      - SERVER_ID=backend
    networks:
      - rlnet

  # 5 req/s per IP, no burst
  nginx-per-ip:
    build: ./nginx
    volumes:
      - ${PWD}/nginx/per_ip.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on: [server]
    networks:
      - rlnet

  # 10 req/s per API key header
  nginx-per-key:
    build: ./nginx
    volumes:
      - ${PWD}/nginx/per_key.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on: [server]
    networks:
      - rlnet

  # 2 req/s with burst=10
  nginx-burst:
    build: ./nginx
    volumes:
      - ${PWD}/nginx/burst.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"
    depends_on: [server]
    networks:
      - rlnet

networks:
  rlnet:
    driver: bridge
