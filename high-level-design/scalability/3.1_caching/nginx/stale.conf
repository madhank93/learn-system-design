proxy_cache_path /tmp/nginx_stale levels=1:2 keys_zone=stale_cache:10m
                 max_size=100m inactive=120s use_temp_path=off;

upstream backend {
    server server1:8080;
    server server2:8080;
    server server3:8080;
}

server {
    listen 80;
    location / {
        proxy_cache                   stale_cache;
        proxy_cache_key               "$request_uri";
        proxy_cache_valid             200 10s;
        # Backend sends max-age=30, which would otherwise override the 10s TTL.
        proxy_ignore_headers          Cache-Control Expires;
        proxy_cache_use_stale         error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock              on;
        add_header                    X-Cache-Status $upstream_cache_status;
        proxy_pass                    http://backend;
        proxy_set_header              Host $host;
        proxy_set_header              X-Real-IP $remote_addr;
    }
}
