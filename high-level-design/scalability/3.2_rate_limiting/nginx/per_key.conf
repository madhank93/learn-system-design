limit_req_zone $http_x_api_key zone=per_key:10m rate=10r/s;

upstream backend {
    server server:8080;
}

server {
    listen 80;

    location / {
        limit_req           zone=per_key nodelay;
        limit_req_status    429;
        proxy_pass          http://backend;
        proxy_set_header    Host $host;
        proxy_set_header    X-Api-Key $http_x_api_key;
    }
}
