limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;

upstream backend {
    server server:8080;
}

server {
    listen 80;

    location / {
        limit_req           zone=per_ip nodelay;
        limit_req_status    429;
        proxy_pass          http://backend;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
    }
}
