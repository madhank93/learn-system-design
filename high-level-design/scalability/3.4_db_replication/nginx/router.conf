upstream primary {
    server primary:8080;
}

upstream replicas {
    server replica-1:8080;
    server replica-2:8080;
}

server {
    listen 80;

    location /write {
        proxy_pass       http://primary;
        proxy_set_header Host $host;
    }

    location /read {
        proxy_pass       http://replicas;
        proxy_set_header Host $host;
    }

    location /lag {
        proxy_pass       http://replicas;
        proxy_set_header Host $host;
    }
}
