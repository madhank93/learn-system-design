services:
  redis:
    image: redis:7-alpine
    networks:
      - locknet

  worker-1:
    build: ./worker
    environment:
      - WORKER_ID=worker-1
      - REDIS_ADDR=redis:6379
    ports:
      - "8081:8080"
    depends_on:
      - redis
    networks:
      - locknet

  worker-2:
    build: ./worker
    environment:
      - WORKER_ID=worker-2
      - REDIS_ADDR=redis:6379
    ports:
      - "8082:8080"
    depends_on:
      - redis
    networks:
      - locknet

  worker-3:
    build: ./worker
    environment:
      - WORKER_ID=worker-3
      - REDIS_ADDR=redis:6379
    ports:
      - "8083:8080"
    depends_on:
      - redis
    networks:
      - locknet

networks:
  locknet:
    driver: bridge
