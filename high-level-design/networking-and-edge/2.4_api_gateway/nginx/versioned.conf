upstream users {
    server user-service:8080;
}

upstream products {
    server product-service:8080;
}

server {
    listen 80;

    location /v1/users {
        add_header X-Api-Version   "v1";
        add_header Deprecation     "true";
        add_header Link            '</v2/users>; rel="successor-version"';
        proxy_pass                 http://users/users;
        proxy_set_header           Host $host;
    }

    location /v2/users {
        add_header X-Api-Version   "v2";
        proxy_pass                 http://users/users;
        proxy_set_header           Host $host;
    }

    location /v1/products {
        add_header X-Api-Version   "v1";
        add_header Deprecation     "true";
        proxy_pass                 http://products/products;
        proxy_set_header           Host $host;
    }

    location /v2/products {
        add_header X-Api-Version   "v2";
        proxy_pass                 http://products/products;
        proxy_set_header           Host $host;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"use /v1 or /v2"}\n';
    }
}
