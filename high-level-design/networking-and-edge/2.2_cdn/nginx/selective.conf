proxy_cache_path /tmp/selective_cache levels=1:2 keys_zone=sel:20m
                 max_size=500m inactive=1h use_temp_path=off;

upstream origin {
    server origin:8080;
}

server {
    listen 80;

    location /static/ {
        proxy_cache        sel;
        proxy_cache_key    "$request_uri";
        proxy_cache_valid  200 5m;
        proxy_cache_lock   on;
        add_header         X-Cache-Status $upstream_cache_status;
        add_header         X-Served-By    "edge-static";
        proxy_pass         http://origin;
    }

    location /api/ {
        proxy_cache off;
        add_header  X-Served-By "origin-passthrough";
        proxy_pass  http://origin;
    }
}
