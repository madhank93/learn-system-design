# syslings caching 02: entries expire after 3s, and whoever shows up next
# pays the full backend latency while the cache refreshes synchronously.
# Production caches hand out the slightly-stale copy and refresh in the
# background. Teach this one the trick.
proxy_cache_path /tmp/nginx_stale levels=1:2 keys_zone=stale_cache:10m
                 max_size=100m inactive=120s use_temp_path=off;

upstream backend {
    server server1:8080;
    server server2:8080;
    server server3:8080;
}

server {
    listen 80;
    location / {
        proxy_cache                   stale_cache;
        proxy_cache_key               "$request_uri";
        proxy_cache_valid             200 3s;
        # the backend sends Cache-Control: max-age=30 — ignore it so the
        # 3s validity above is what actually governs expiry
        proxy_ignore_headers          Cache-Control Expires;
        add_header                    X-Cache-Status $upstream_cache_status;
        proxy_pass                    http://backend;
        proxy_set_header              Host $host;
        proxy_set_header              X-Real-IP $remote_addr;
    }
}
