# syslings 02: round robin is supposed to give every server a fair turn.
# Someone had other plans. Fix the rotation, save, and watch the check rerun.
upstream backend {
    zone backend_zone 64k;
    server server1:8080 weight=100;
    server server2:8080;
    server server3:8080;
}

server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
    }
}
