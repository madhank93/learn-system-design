# syslings 06: someone decommissioned a VM but never removed it from the pool.
# Its IP still routes nowhere — a black hole. nginx is supposed to retry a dead
# upstream on the next server, yet clients are timing out. How long does nginx
# wait for a connection before it gives up?
upstream backend {
    zone backend_zone 64k;
    server server1:8080;
    server server2:8080;
    server server3:8080;
    server 10.255.255.1:8080;  # "temporary" capacity, decommissioned in 2024
}

server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_next_upstream error timeout;
    }
}
