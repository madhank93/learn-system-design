# syslings 03: this balancer claims to send traffic to the least-busy server.
# The check will park two slow requests and time where the quick ones go.
upstream backend {
    zone backend_zone 64k;
    server server1:8080;
    server server2:8080;
    server server3:8080;
}

server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
    }
}
